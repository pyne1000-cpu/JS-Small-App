<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Verify Boxf</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .container{
            width: 600px;
            background-color: #f4f4f4;
            /* border: 1px solid rgba(0, 0, 0, .5); */
            text-align: center;

            padding: 20px;
        }
        h3{
            font-size: 1.8rem;
        }
        .img-box input{
            display: none;
        }
        .img-box img{
            width: 200px;
            height: 200px;
            margin: 10px;

            object-fit: cover;
        }
        .img-box img:hover{
            box-shadow: 0 2px 5px rgba(0, 0, 0, .5);
            transform: scale(1.1);
        }
        .btn{
            width: 150px;
            background-color: skyblue;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 24px;
            outline: none;

            box-shadow: 0 4px 5px rgba(0, 0, 0, .5);

            padding: 15px;
            margin-top: 10px;
        }
        .btn:hover{
            background-color: rgb(72, 182, 226);
        }
        .btn:active{
            box-shadow: 0 2px 5px rgba(0, 0, 0, .5);
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h3 class="question">Question?</h3>
        <div class="img-box">
            <input type="radio" id="a" class=""><label for="a"><img src="./img/img_a.jpg" alt="" id="img-a"></label>
            <input type="radio" id="b" class=""><label for="b"><img src="./img/img_b.jpg" alt="" id="img-b"></label>
            <input type="radio" id="c" class=""><label for="c"><img src="./img/img_c.jpg" alt="" id="img-c"></label>
            <input type="radio" id="d" class=""><label for="d"><img src="./img/img_d.jpg" alt="" id="img-d"></label>
        </div>
        <button class="btn">Next</button>
    </div>

    <script>
        const geta = document.getElementById('a');
    </script>
</body>
</html>
