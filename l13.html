<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Verify Boxf</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .container{
            width: 600px;
            background-color: #f4f4f4;
            /* border: 1px solid rgba(0, 0, 0, .5); */
            text-align: center;

            padding: 20px;
        }
        h3{
            font-size: 1.8rem;
        }
        .img-box input{
            display: none;
        }
        .img-box img{
            width: 200px;
            height: 200px;
            margin: 10px;

            object-fit: cover;
        }
        .img-box img:hover,.answer:checked + label img{
            box-shadow: 0 2px 5px rgba(0, 0, 0, .5);
            transform: scale(1.1);
        }
        .btn{
            width: 150px;
            background-color: skyblue;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 24px;
            outline: none;

            box-shadow: 0 4px 5px rgba(0, 0, 0, .5);

            padding: 15px;
            margin-top: 10px;
        }
        .btn:hover{
            background-color: rgb(72, 182, 226);
        }
        .btn:active{
            box-shadow: 0 2px 5px rgba(0, 0, 0, .5);
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h3 class="question"></h3>
        <div class="img-box">
            <input type="radio" id="1" class="answer"><label for="1"><img src="" alt="" id="img-a"></label>
            <input type="radio" id="2" class="answer"><label for="2"><img src="" alt="" id="img-b"></label>
            <input type="radio" id="3" class="answer"><label for="3"><img src="" alt="" id="img-c"></label>
            <input type="radio" id="4" class="answer"><label for="4"><img src="" alt="" id="img-d"></label>
        </div>
        <button type="button" class="btn">Next</button>
    </div>

    <script>
        
        const database = [
            {question:"Show Mountain",
             1:"./img/img_a.jpg",   
             2:"./img/img_b.jpg",   
             3:"./img/img_c.jpg",   
             4:"./img/img_d.jpg",   
             correct:"2"   

            },
            {question:"Show Ooe",
             1:"./img/img_c.jpg",   
             2:"./img/img_d.jpg",   
             3:"./img/img_b.jpg",   
             4:"./img/img_a.jpg", 
             correct:"2"   
            },
            {question:"Choose Bulb",
             1:"./img/img_d.jpg",   
             2:"./img/img_c.jpg",   
             3:"./img/img_a.jpg",   
             4:"./img/img_b.jpg",  
             correct:"3"   
            },
            {question:"Choose Air",
             1:"./img/img_b.jpg",   
             2:"./img/img_d.jpg",   
             3:"./img/img_a.jpg",   
             4:"./img/img_c.jpg",
             correct:"4"   
            }
        ];

        const getcontainer = document.querySelector('.container'), 
             getquestion = document.querySelector('.question'),
             getinputs = document.querySelectorAll('.answer'),
             getbtn = document.querySelector('.btn'),
             getimga = document.getElementById('img-a'),
             getimgb = document.getElementById('img-b'),
             getimgc = document.getElementById('img-c'),
             getimgd = document.getElementById('img-d');

            let curidx = 0,
                score = 0;
        function showquestion(){
            getinputs.forEach((getinput)=>{
                getinput.checked = false;
            })
            getquestion.textContent = database[curidx].question;

            getimga.src = database[curidx][1];
            getimgb.src = database[curidx][2];
            getimgc.src = database[curidx][3];
            getimgd.src = database[curidx][4];
            
        }    
        
        showquestion();

        function getsingleinput(){
            let getinputid;
            getinputs.forEach(function(getinput){
                // console.log(getinput);
                if(getinput.checked){
                        // console.log(getinput.id);
                        getinputid = getinput.id;
                    }  
            })
            return getinputid;
        }
        
        getbtn.addEventListener('click',function(e){
            const chosen = getsingleinput();
            // console.log(chosen);  
            
            if(chosen){
                if(chosen === database[curidx].correct){
                    score++;
                }
                curidx++;

                if(curidx<database.length){
                    showquestion()
                }else{
                    getcontainer.innerHTML = `
                        <h3>Your Score is ${score}</h3>
                        <button type="button" class="btn" ondblclick="window.location.reload();">Double Click to Reload</button>
                        `
                }

            }else{
                    window.alert("Please choose one picture");
                } 
        })
    </script>
</body>
</html>
