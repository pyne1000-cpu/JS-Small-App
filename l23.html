<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor</title>

     <!-- font awesome css 1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- bootstrap css 1 js 1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            /* border: 1px solid red; */
            box-shadow: 0 0 10px rgba(0, 0, 0, .5);
        }
        h4{
            text-align: center;
            color: Red;
            margin-top: 10px;
        }
        button{
            margin: 10px 5px;
        }
        .divarea{
            min-height: 200px;
            max-height: 400px;
            overflow-y: scroll;
            border: 1px solid rgba(0, 0, 0, .5);
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h4>Text Editor</h4>
        <div class="row">
            <div class="col-md-12">
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Bold Text" data-command="bold"><i class="fa-solid fa-b"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Italic Text" data-command="italic"><i class="fa-solid fa-italic"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Under Line" data-command="underline"><i class="fa-solid fa-underline"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Line Through" data-command="strikethrough"><i class="fa-solid fa-strikethrough"></i></button>

                <button type="button" class="btn btn-outline-secondary rounded-0" title="Left Text" data-command="justifyLeft"><i class="fa-solid fa-align-left"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Center Text" data-command="justifyCenter"><i class="fa-solid fa-align-center"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Right Text" data-command="justifyRight"><i class="fa-solid fa-align-right"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Justify Text" data-command="justifyFull"><i class="fa-solid fa-align-justify"></i></button>

                <button type="button" class="btn btn-outline-secondary rounded-0" title="Upper Case" onclick="upcase()">Upper Case</button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Lower Case" onclick="lowcase()">Lower Case</button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Capitalize" onclick="capcase()">Capitalize</button>

                <button type="button" class="btn btn-outline-secondary rounded-0" title="Subscript" data-command="subscript"><i class="fa-solid fa-subscript"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Superscript" data-command="superscript"><i class="fa-solid fa-subscript"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Ruler" data-command="insertHorizontalRule"><i class="fa-solid fa-ruler"></i></button>

                <button type="button" class="btn btn-outline-secondary rounded-0" title="Unorder List" data-command="unorderList"><i class="fa-solid fa-list"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Order List" data-command="orderList"><i class="fa-solid fa-list-ol"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Select All" data-command="select"><i class="fa-solid fa-check"></i></button>

                <button type="button" class="btn btn-outline-secondary rounded-0" title="Clear" data-command="delete"><i class="fa-solid fa-delete-left"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Forward Delete" data-command="forwarddelete"><i class="fa-solid fa-trash-can"></i></button>

                <button type="button" class="btn btn-outline-secondary rounded-0" title="Copy" data-command="copy"><i class="fa-solid fa-copy"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Cut" data-command="cut"><i class="fa-solid fa-scissors"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Paste" data-command="paste"><i class="fa-solid fa-paste"></i></button>

                <button type="button" class="btn btn-outline-secondary rounded-0" title="Undo" data-command="undo"><i class="fa-solid fa-arrow-rotate-left"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Redo" data-command="redo"><i class="fa-solid fa-arrow-rotate-right"></i></button>

                <button type="button" class="btn btn-outline-secondary rounded-0" title="Link" data-command="createLink"><i class="fa-solid fa-link"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Unlink" data-command="unlink"><i class="fa-solid fa-unlink"></i></button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Image" data-command="insertImage"><i class="fa-solid fa-image"></i></button>

                <select name="bgcolor" id="bgcolor" class="btn btn-outline-secondary rounded-0" data-command="backColor">
                    <option value="black">Black</option>
                    <option value="red">Red</option>
                    <option value="white">White</option>
                    <option value="green">Green</option>
                    <option value="blue">Blue</option>
                    <option value="yellow">Yellow</option>
                </select>

                <select name="fntname" id="fntname" class="btn btn-outline-secondary rounded-0" data-command="fontName">
                    <option value="arial">Arial</option>
                    <option value="century">Century</option>
                    <option value="sans-serif">Sans-Serif</option>
                    <option value="time new roman">Time New Roman</option>
                </select>

                <select name="forecolor" id="forecolor" class="btn btn-outline-secondary rounded-0" data-command="foreColor">
                    <option value="black">Black</option>
                    <option value="red">Red</option>
                    <option value="white">White</option>
                    <option value="green">Green</option>
                    <option value="blue">Blue</option>
                    <option value="yellow">Yellow</option>
                </select>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Clear" data-command="clear">Clear</button>
                <button type="button" class="btn btn-outline-secondary rounded-0" title="Remove Format" data-command="removeFormat">Remove Format</button>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <form action="" method="">
                    <div id="divarea" class="divarea " contenteditable="true" spellcheck="false"></div>
                    <div class="text-end">
                        <button type="button" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </form>    
            </div>
        </div>
    </div>

    <!-- bootstrap css 1 js 1 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        const getdivarea = document.getElementById('divarea'),
              getbtns = document.querySelectorAll('.btn'),
              getselects = document.querySelectorAll('select');

              getbtns.forEach((btn)=>{
                btn.addEventListener('click',function(){
                    const getcommand = this.dataset['command'];
                    console.log(getcommand);
                    getdivarea.blur();
                    if(getcommand === 'clear'){
                        getdivarea.textContent = ''; 
                    }
                    else if(getcommand === 'createLink' || getcommand === 'insertImage'){
                        let value = prompt("Enter your link...","https://")
                        document.execCommand(getcommand,true,value);
                    }
                    else if(getcommand === 'paste'){
                        navigator.clipboard.readText().then(function(text){
                            getdivarea.textContent += text; 
                        })
                    }
                    else if(getcommand === 'backColor' || getcommand === 'foreColor' || getcommand === 'fontName'){
                        let value = btn.value;
                        document.execCommand(getcommand,false,value);   
                    }
                    else{
                        document.execCommand(getcommand,false,null);
                    }
                })
              })

        function upcase(){
            getdivarea.style.textTransform = 'uppercase';
        }
        function lowcase(){
            getdivarea.style.textTransform = 'lowercase';
        }
        function capcase(){
            getdivarea.style.textTransform = 'capitalize';
        }      

    </script>
</body>
</html>
