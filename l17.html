<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .container{
            box-shadow: 0 10px 15px rgba(0, 0, 0, .5);
        }
        .container:fullscreen{
            width: 100%;
            height: 100%;
        }
        .videoscreen{
            width: 700px;
            height: 400px;
            display: block;
        }
        .player{
            display: flex;
            width: 700px;
            /* flex-direction: row; */
            justify-content: space-evenly;
            background-color: #1b1a1a;
            color: #f4f4f4;
            padding: 20px;
        }
        .player:fullscreen{
            width: 100%;
            height: 100%;
        }
        .player i{
            cursor: pointer;
        }
        .progress{
            width: 300px;
            height: 10px;
            background-color: #f4f4f4;
            cursor: pointer;

            border-radius: 24px;
            margin: 4px 3px 3px 10px;

            overflow: hidden;
        }
        .progress-bar{
            width: 0%;
            height: 100%;
            background-color: rgb(243, 11, 11);
            border-radius: 24px 0 0 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <video src="" id="videoscreen" class="videoscreen"></video>

        <div class="player">
            <div id="prev" class="prev">
                <i class="fa-solid fa-backward"></i>
            </div>
            <div id="play" class="play">
                <i class="fa-solid fa-play"></i>
            </div>
            <div id="next" class="next">
                <i class="fa-solid fa-forward"></i>
            </div>
            <div id="reload" class="reload">
                <i class="fa-solid fa-rotate-right"></i>
            </div>
            <div id="fullscreen" class="fullscreen">
                <i class="fa-solid fa-maximize"></i>
            </div>
            <div class="progress">
                <div class="progress-bar"></div>
            </div>
            <span class="time">00:00/00:00</span>

            <div>
                <i class="fa-solid fa-volume"></i>
                <input type="range" name="volume" id="volume" class="volume" min="0" max="100" value="100"> 
            </div>
        </div>    
    </div>

    <script>
        const getvideoscreen = document.getElementById('videoscreen');
   
        // console.log(getvideoscreen.videoWidth);
        // console.log(getvideoscreen.videoHeight);
        getvideoscreen.addEventListener('loadedmetadata', () => {
        console.log("metadata loaded");
        console.log(getvideoscreen.videoWidth);
        console.log(getvideoscreen.videoHeight);
    });
        
        const playbtn = document.getElementById('play'),
              prevbtn = document.getElementById('prev'),
              nextbtn = document.getElementById('next'),
              reloadbtn = document.getElementById('reload'),
              fullscreenbtn = document.getElementById('fullscreen');

        // console.log(playbtn.querySelector('i.fa-solid'));

        const getprogress = document.querySelector('.progress'),
              getprogressbar = document.querySelector('.progress-bar');

        const gettime = document.querySelector('.time'); 

        const getvolume = document.querySelector('#volume');

        const videos = ['sample1','sample2','sample3'];
        let idx = 0;

        function loadvideo(video){
            getvideoscreen.src = `./source/mp4/${video}.mp4`;
        }
        function playvideo(){
            console.log('playing video');
            playbtn.querySelector('i.fa-solid').classList.remove('fa-play');
            playbtn.querySelector('i.fa-solid').classList.add('fa-pause');
            getvideoscreen.play();
        }
        function pausevideo(){
            console.log('video paused');
            playbtn.querySelector('i.fa-solid').classList.remove('fa-pause');
            playbtn.querySelector('i.fa-solid').classList.add('fa-play');
            getvideoscreen.pause();
        }
        function playorpause(){
            if(getvideoscreen.paused){
                playvideo();
            }else{
                pausevideo();
            }
        }
        function prev(){
            idx--;
            if(idx<0){
                idx = videos.length-1;
            }
            loadvideo(videos[idx]);
            playvideo();
        }
        function next(){
            idx++;
            if(idx>videos.length-1){
                idx = 0;
            }
            loadvideo(videos[idx]);
            playvideo();   
        }
        function restartvideo(){
            getvideoscreen.currentTime = 0;
        }
        function updateprogressbar(){
            // console.log('progress-bar running');
            // console.log(getprogress.clientWidth);
            getprogressbar.style.width = `${(getprogress.clientWidth/getvideoscreen.duration)*getvideoscreen.currentTime}px`;
        }
        function progressbarcontrol(e){
            console.log("controling");
            console.log(this.clientWidth);
            const width = this.clientWidth;
            // console.log(e.offsetX);
            let curwidth = e.offsetX+1;
            const b = getvideoscreen.duration;

            console.log(`${(b/width)*curwidth}`);
            getvideoscreen.currentTime = `${(b/width)*curwidth}`;
        }
        function volumecontrol(){
            // console.log(getvolume.value);
            // console.log(getvideoscreen.volume);
            getvideoscreen.volume = getvolume.value/100;
        }
        function fullscreen(){
            console.log("Full Screen");
            // getvideoscreen.requestFullscreen();
            document.querySelector('.container').requestFullscreen();
        }

        loadvideo(videos[idx]);
        getvideoscreen.addEventListener('play',playvideo);
        getvideoscreen.addEventListener('pause',pausevideo);
        playbtn.addEventListener('click',playorpause);
        prevbtn.addEventListener('click',prev);
        nextbtn.addEventListener('click',next);
        reloadbtn.addEventListener('click',restartvideo);
        fullscreenbtn.addEventListener('click',fullscreen);
        getvideoscreen.addEventListener('timeupdate',updateprogressbar);
        getprogress.addEventListener('click',progressbarcontrol);
        getvolume.addEventListener('click',volumecontrol);
    </script>
</body>
</html>
