<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .player{
            display: flex;
            width: 700px;
            flex-direction: row;
            justify-content: space-evenly;
            background-color: #1b1a1a;
            color: #f4f4f4;
            padding: 20px;
        }
        .videoscreen{
            width: 700px;
            display: block;
            background-color: #f80606;
        }
        .player i{
            cursor: pointer;
        }
        .progress{
            width: 300px;
            height: 10px;
            background-color: #f4f4f4;
            cursor: pointer;

            border-radius: 24px;
            margin: 4px 3px 3px 10px;

            overflow: hidden;
        }
        .progress-bar{
            width: 0%;
            height: 100%;
            background-color: rgb(243, 11, 11);
            border-radius: 24px 0 0 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <video src="" id="videoscreen" class="videoscreen"></video>

        <div class="player">
            <div id="prev" class="prev">
                <i class="fa-solid fa-backward"></i>
            </div>
            <div id="play" class="play">
                <i class="fa-solid fa-play"></i>
            </div>
            <div id="next" class="next">
                <i class="fa-solid fa-forward"></i>
            </div>
            <div id="reload" class="reload">
                <i class="fa-solid fa-rotate-right"></i>
            </div>
            <div class="progress">
                <div class="progress-bar"></div>
            </div>
            <span class="time">00:00/00:00</span>

            <div>
                <i class="fa-solid fa-volume"></i>
                <input type="range" name="volume" id="volume" class="volume" min="0" max="100" value="100"> 
            </div>
        </div>    
    </div>

    <script>

    </script>
</body>
</html>
