<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.0">
    <title>Carousel</title>
    <!-- fontawesome css1  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- custom css  -->
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body{
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .dots{
            display: flex;
            
            position: absolute;
            bottom: 10px;
            left: 50%;

            transform: translateX(-50%);
        }
        .dot{
            width: 12px;
            height: 12px;
            background-color: #3fb9f1;
            border-radius: 50%;

            margin: 0 5px;

            opacity: .9;
        }
        .dot:hover,.dot.active{
            background-color: #1980af;
            opacity: 1;
        }

        .carousel{
            width: 500px;
            height: 300px;
            background-color: #444;

            display: flex;

            position: relative;
        }

        .carousel-item{
            /* display: none; */

            width: 500px;
            height: inherit;
            text-align: center;
            background-color: #f4f4f4;

        }

        .carousel-item img{
            width: 200px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 2px rgba(0, 0, 0, .8);
            margin: 5px;
        }

        .prev,.next{
            /* background-color: red; */
            font-size: 2rem;
            color: #555;

            opacity: .8;
        }
        .prev:hover,.next:hover{
            opacity: 1;
        }
        .prev{
            position: absolute;
            top: 50%;
            left: 5px;

            transform: translateY(-50%);

            z-index: 10;
        }
        .next{
            position: absolute;
            top: 50%;
            right: 5px;

            transform: translateY(-50%);

            z-index: 10;

        }
      
    </style>
</head>
<body>
    <div class="carousel">
       <div class="dots">
            <div id="0" class="dot"></div>
            <div id="1" class="dot"></div>
            <div id="2" class="dot"></div>
       </div>
        <div class="carousel-item">
            <img src="./user/user1.jpg" alt="">
            <h3 style="margin-bottom: 10px;">Producer</h3>
            <p>The saw beyond saw never saw the saw</p>
        </div>
        <div class="carousel-item">
            <img src="./user/user2.jpg" alt="">
            <h3 style="margin-bottom: 10px;">Senior Develper</h3>
            <p>The saw beyond saw never saw the saw</p>
        </div>
        <div class="carousel-item">
            <img src="./user/user3.jpg" alt="">
            <h3 style="margin-bottom: 10px;">Sale & Marketing</h3>
            <p>The saw beyond saw never saw the saw</p>
        </div>
         <div class="prev">
            <i class="fa-solid fa-angle-left"></i>
         </div>
         <div class="next">
            <i class="fa-solid fa-angle-right"></i>
         </div>
    </div>

    <script>
        let current = 0;

        const getprev = document.querySelector('.prev i');
        // console.log(getprev);
        getprev.addEventListener('click',function(){
            current--;
            if(current>getcarouselitems.length-1){
                current = 0;
            }else if(current<0){
                current = getcarouselitems.length-1;
            } 
            carousel(current);
            console.log(current);
        })

        const getnext = document.querySelector('.next i');
        console.log(getnext);
        getnext.addEventListener('click',function(){
            current++;
            if(current>getcarouselitems.length-1){
                current = 0;
            }else if(current<0){
                current = getcarouselitems.length-1;
            }
            carousel(current);
            console.log(current);
        })
       
        const getcarouselitems = document.getElementsByClassName('carousel-item');
        console.log(getcarouselitems);

        const getdots = document.getElementsByClassName('dot');
        console.log(getdots);

        function carousel(slidenum){
            for(let x=0; x<getcarouselitems.length; x++){
                getcarouselitems[x].style.display = "none";
                getdots[x].className = "dot";
            }

            getcarouselitems[slidenum].style.display = "block";
            getdots[slidenum].classList.add("active");
        }
            
        carousel(current);

        for(let y=0; y<getdots.length; y++){
            getdots[y].addEventListener('click',function(e){
                current = e.target.id;
                console.log(current);

                carousel(current);
            })
        }
    </script>
</body>
</html>
