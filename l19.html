<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Input to Text</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        body{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .container{
            background-color: #f4f4f4;
            padding: 20px;
        }
        .guessnum{
            border: none;
            outline: none;
            margin-bottom: 10px;
            padding: 10px;
        }
        .submit-btn{
            background-color: skyblue;
            color: #f4f4f4;
            border: none;
            outline: none;
            padding: 8px 20px;
            border-radius: 5px;
            box-shadow: 0 0 3px rgba(0, 0, 0, .5);
        }
        .submit-btn:hover{
            cursor: pointer;
        }
        .submit-btn:active{
            transform: translateY(1px);
        }
        #mic-btn{
            display: block;
            background-color: red;
            color: #f4f4f4;
            width: 150px;
            margin: 10px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Number Guess Game</h3>
        <label for="guessnum"></label>
        <form action="">
            <input type="number" id="guessnum" class="guessnum" placeholder="1 to 99" min="0" max="99">

            <button type="submit" class="submit-btn">Submit</button>
        </form>
        <button id="mic-btn"><i class="fa-solid fa-microphone"></i>Use Microphone</button>
        <div class="showmessage">
            <span class="message"></span>
        </div>
    </div>

    <script>
        const getguessnum = document.getElementById('guessnum'),
              getsubmitbtn = document.querySelector('.submit-btn'),
              getmessage = document.querySelector('.message'),
              getmicbtn = document.getElementById('mic-btn');
        
        const gameleft = 3,
            min = 1,
            max = 99,
            // winningnum = 20;
            winningnum = Math.random(min,max);
            console.log(winningnum);
              
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let getrec = new window.SpeechRecognition;

        getsubmitbtn.disabled = true;

        getmicbtn.addEventListener('click',function(){
            console.log('mic');
            getrec.start();

            getrec.addEventListener('result',(e)=>talking(e));
        })

        let resulttonum;
        function talking(ele){
            console.log(ele);
            const micresult = ele.results[0][0].transcript;
            resulttonum = +micresult;
            console.log(micresult);
            console.log(typeof micresult);
            console.log(resulttonum);
            console.log(typeof resulttonum);

            getnum(resulttonum);
        }

        function getnum(msg){
            if(Number.isNaN(msg)){
                console.log('Invalid Number!!!');
                getsubmitbtn.disabled = true;
                getmessage.style.color = "black";
                getmessage.textContent = `Say a Valid Number`;
                return false;
            }
            console.log('Valid Number');
            getmessage.style.color = "black";
            getmessage.innerHTML = `Did you say : [ ${msg} ]`
            getsubmitbtn.disabled = false;
            // getmicbtn.disabled = true;
        }

        getsubmitbtn.addEventListener('click',function(e){
                e.preventDefault();
        
                getsubmitbtn.disabled = true;
                getmicbtn.disabled = false;


                if(resulttonum === winningnum){
                    getmessage.style.color = "green";
                    getmessage.textContent = `You answer is Correct,You WIN!!!`;
                    playagain();
                    }else{
                        gameleft--;
                        console.log(gameleft);
                        getmessage.style.color = "red";
                        getmessage.textContent = `${resulttonum} is Not Correct,${gameleft} Chance left!!!`;
                        if(gameleft<=0){
                            playagain();
                            getmessage.textContent = `${resulttonum} is Not Correct,Try Again!!!`;
                        }
                    }
                })

        function playagain(){
            getsubmitbtn.disabled = false;
            getmicbtn.disabled = true;
            getsubmitbtn.textContent = "Play Again";
            getsubmitbtn.addEventListener('click',function(){
                window.location.reload();
                }
            )
        }

    </script>
</body>
</html>
