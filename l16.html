<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .player{
            display: flex;
            width: 700px;
            flex-direction: row;
            justify-content: space-evenly;
            background-color: #1b1a1a;
            color: #f4f4f4;
            padding: 20px;
        }
        .player i{
            cursor: pointer;
        }
        .progress{
            width: 300px;
            height: 10px;
            background-color: #f4f4f4;
            cursor: pointer;

            border-radius: 24px;
            margin: 4px 3px 3px 10px;

            overflow: hidden;
        }
        .progress-bar{
            width: 0%;
            height: 100%;
            background-color: rgb(243, 11, 11);
            border-radius: 24px 0 0 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player">
            <audio src="" id="audioscreen" class="audioscreen"></audio>
            <div id="prev" class="prev">
                <i class="fa-solid fa-backward"></i>
            </div>
            <div id="play" class="play">
                <i class="fa-solid fa-play"></i>
            </div>
            <div id="next" class="next">
                <i class="fa-solid fa-forward"></i>
            </div>
            <div id="reload" class="reload">
                <i class="fa-solid fa-rotate-right"></i>
            </div>
            <div class="progress">
                <div class="progress-bar"></div>
            </div>
            <span class="time">00:00/00:00</span>

            <div>
                <i class="fa-solid fa-volume"></i>
                <input type="range" name="volume" id="volume" class="volume" min="0" max="100" value="100"> 
            </div>
        </div>    
    </div>

    <script>
        const getaudioscreen = document.getElementById('audioscreen');
        
        const playbtn = document.getElementById('play'),
              prevbtn = document.getElementById('prev'),
              nextbtn = document.getElementById('next'),
              reloadbtn = document.getElementById('reload');

        // console.log(playbtn.querySelector('i.fa-solid'));

        const getprogress = document.querySelector('.progress'),
              getprogressbar = document.querySelector('.progress-bar');

        const gettime = document.querySelector('.time'); 

        const getvolume = document.querySelector('#volume');

        // getaudioscreen.addEventListener('play',playaudio);
        getaudioscreen.addEventListener('timeupdate',updateprogressbar);
        getaudioscreen.addEventListener('play',playaudio);
        getaudioscreen.addEventListener('pause',pauseaudio);
        playbtn.addEventListener('click',playorpause);  
        prevbtn.addEventListener('click',prev);    
        nextbtn.addEventListener('click',next);    
        reloadbtn.addEventListener('click',reloadaudio);    
        getvolume.addEventListener('click',function(){
            console.log(this.value);
            getaudioscreen.volume = this.value/100;
        })
        getprogress.addEventListener('click',progressbarcontrol);

        const songs = ['sample1','sample2','sample3'];
        let idx = 0;

        loadaudio(songs[idx]);
        // console.log(songs[idx]);
        
        function loadaudio(audio){
            getaudioscreen.src = `./source/mp3/${audio}.mp3`
        }

        function playorpause(){
            console.log('play or pause');
            if(getaudioscreen.paused){
                playaudio();
            }else{
                pauseaudio();
            }
        }      

        function playaudio(){
            // console.log('play');
            playbtn.querySelector('i').classList.remove('fa-play');
            playbtn.querySelector('i').classList.add('fa-pause');
            getaudioscreen.play();
        }

        function pauseaudio(){
            console.log('pause');
            playbtn.querySelector('i').classList.remove('fa-pause');
            playbtn.querySelector('i').classList.add('fa-play');
            getaudioscreen.pause();
        }
        
        function prev(){
            idx--;
            if(idx<0){
                idx = songs.length-1;
            }
            loadaudio(songs[idx]);
            playaudio();
        }      
        
        function next(){
            idx++;
            if(idx>songs.length-1){
                idx = 0;
            }
            loadaudio(songs[idx]);
            playaudio();
        }      

        function reloadaudio(){
            // getaudioscreen.load();
            getaudioscreen.currentTime = 0;
            getprogressbar.style.width = `${getaudioscreen.currentTime}%`;
            // pauseaudio();
        }      

        function updateprogressbar(){
            // console.log(Math.floor(`${(300/getaudioscreen.duration)*getaudioscreen.currentTime}`));
            getprogressbar.style.width = `${(300/getaudioscreen.duration)*getaudioscreen.currentTime}px`;
            const curmin = Math.floor(getaudioscreen.currentTime / 60),
                  cursec = Math.floor(getaudioscreen.currentTime % 60),
                  totalmin = Math.floor(getaudioscreen.duration / 60),
                  totalsec = Math.floor(getaudioscreen.duration % 60);
            gettime.textContent = `${curmin.toString().padStart(2,'0')}:${cursec.toString().padStart(2,'0')}/${totalmin.toString().padStart(2,'0')}:${totalsec.toString().padStart(2,'0')}`;
        }

        function progressbarcontrol(b){
            // console.log(b.target);
            const width = b.target.clientWidth;
            // console.log(width);
            const clickx = b.offsetX+1;
            // console.log(clickx);

            getaudioscreen.currentTime = `${(getaudioscreen.duration/width)*clickx}`;
            getprogressbar.style.width = `${(getaudioscreen.duration/width)*clickx}px`;
            playaudio();
        }
    </script>
</body>
</html>
