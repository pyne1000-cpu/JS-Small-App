<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            display: grid;
            place-items: center;
            height: 100vh;
        }
        .container{
            width: 600px;
            height: 400px;
            background-color: #f4f4f4;
            box-shadow: 0 0 8px rgba(0, 0, 0, .5);
            padding: 20px;
        }
        .month{
            float: left;
            position: relative;
        }
        .year{
            float: right;
            position: relative;
        }
        .month .curmonth,.year .curyear{
            width: 100px;
            background-color: skyblue;
            color: #fff;
            font-size: 24px;
            padding: 5px 30px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            border: none;
            outline: none;
        }
        .month .curmonth:hover,.year .curyear:hover{
            background-color: steelblue;
            cursor: pointer;
        }
        .month-list,.year-list{
            display: none;

            position: absolute;
            top: 100%;
            left: 0;
            z-index: 10;
        }
        .month-list .months,.year-list .years{
            width: 100px;
            text-align: center;
            background-color: #f4f4f4;
            color: rgba(0, 0, 0, .5);
            padding: 5px 0;
            border: 1px solid skyblue;
            border-top: none;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .month-list .months:hover,.year-list .years:hover{
            color: rgba(0, 0, 0, 1);
            border: 2px solid steelblue;
            cursor: pointer;
        }
        .dayanddate{
            clear: both;
            /* border: 1px solid #333; */
            position: relative;
            top: 20px;            
            left: 0;
            z-index: 1;
        }
        .days,.dates{
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 10px;
            margin-top: 5px;
        }
        .days label{
            background-color: steelblue;
            color: #fff;
            border: none;
        }
        .dates label    {
            border: 2px solid #333;

        }
        .days label,.dates label{
            text-align: center;
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="month">
            <button class="curmonth" >Aug</button>
            <div class="month-list">
                <div class="months">Jan</div>
                <div class="months">Feb</div>
                <div class="months">Mar</div>
                <div class="months">Apr</div>
                <div class="months">May</div>
                <div class="months">Jun</div>
                <div class="months">Jul</div>
                <div class="months">Aug</div>
                <div class="months">Sep</div>
                <div class="months">Oct</div>
                <div class="months">Nov</div>
                <div class="months">Dec</div>
            </div>
        </div>
        <div class="year">
            <button class="curyear" >2026</button>
            <div class="year-list">
                <div class="years">2025</div>
                <div class="years">2026</div>
                <div class="years">2027</div>
                <div class="years">2028</div>
                <div class="years">2029</div>
                <div class="years">2030</div>
                <div class="years">2031</div>
                <div class="years">2032</div>
                <div class="years">2033</div>
                <div class="years">2034</div>
                <div class="years">2035</div>
            </div>
        </div>
        <div class="dayanddate">
            <div class="days">
                <label class="day">Sun</label>
                <label class="day">Mon</label>
                <label class="day">Tue</label>
                <label class="day">Wed</label>
                <label class="day">Thu</label>
                <label class="day">Fri</label>
                <label class="day">Sat</label>
            </div>
            <div class="dates">
                <label class="date">1</label>
                <label class="date">2</label>
                <label class="date">3</label>
                <label class="date">4</label>
                <label class="date">5</label>
                <label class="date">6</label>
                <label class="date">7</label>
                <label class="date">8</label>
                <label class="date">9</label>
                <label class="date">10</label>
                <label class="date">11</label>
                <label class="date">12</label>
                <label class="date">13</label>
                <label class="date">14</label>
                <label class="date">15</label>
            </div>
        </div>
    </div>

    <script>

    </script>
</body>
</html>
