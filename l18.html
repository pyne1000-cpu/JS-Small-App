<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            display: grid;
            place-items: center;
            height: 100vh;
        }
        .container{
            width: 600px;
            min-height: 400px;
            background-color: #f4f4f4;
            box-shadow: 0 0 8px rgba(0, 0, 0, .5);
            padding: 20px;
        }
        .month{
            float: left;
            position: relative;
        }
        .year{
            float: right;
            position: relative;
        }
        .month .curmonth,.year .curyear{
            width: 100px;
            background-color: skyblue;
            color: #fff;
            font-size: 24px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .5);
            padding: 5px 30px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            border: none;
            outline: none;
        }
        .month .curmonth:hover,.year .curyear:hover{
            background-color: steelblue;
            cursor: pointer;
        }
        .month .curmonth:active,.year .curyear:active{
            box-shadow: 0 1px 5px rgba(0, 0, 0, .5);
            transform: translateY(1px);
        }
        .month-list,.year-list{
            display: none;

            position: absolute;
            top: 100%;
            left: 0;
            z-index: 10;
        }
        .month-list.show,.year-list.show{
            display: block;
        }
        .month-list .months,.year-list .years{
            width: 100px;
            text-align: center;
            background-color: #eee;
            color: rgba(0, 0, 0, .5);
            padding: 5px 0;
            border: 1px solid skyblue;
            border-top: none;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .month-list .months:hover,.year-list .years:hover{
            color: rgba(0, 0, 0, 1);
            background-color: #fff;
            border: 2px solid steelblue;
            cursor: pointer;
        }
        .dayanddate{
            clear: both;
            /* border: 1px solid #333; */
            position: relative;
            top: 20px;            
            left: 0;
            z-index: 1;
        }
        .days,.dates{
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 10px;
        }
        .dates{
            margin-top: 5px ;
            margin-bottom: 10px ;
        }
        .days label{
            background-color: steelblue;
            color: #fff;
            border: none;
        }
        .dates label{
            border: 2px solid #333;
        }
        .days label,.dates label{
            text-align: center;
            padding: 10px 20px;
            border-radius: 20px;
        }
        .dates label.blank{
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="month">
            <button id="curmonth" class="curmonth" >May</button>
            <div class="month-list">
                <div class="months">Jan</div>
                <div class="months">Feb</div>
                <div class="months">Mar</div>
                <div class="months">Apr</div>
                <div class="months">May</div>
                <div class="months">Jun</div>
                <div class="months">Jul</div>
                <div class="months">Aug</div>
                <div class="months">Sep</div>
                <div class="months">Oct</div>
                <div class="months">Nov</div>
                <div class="months">Dec</div>
            </div>
        </div>
        <div class="year">
            <button id="curyear" class="curyear" >2004</button>
            <div class="year-list">
                <div class="years">2025</div>
                <div class="years">2026</div>
                <div class="years">2027</div>
                <div class="years">2028</div>
                <div class="years">2029</div>
                <div class="years">2030</div>
                <div class="years">2031</div>
                <div class="years">2032</div>
                <div class="years">2033</div>
                <div class="years">2034</div>
                <div class="years">2035</div>
            </div>
        </div>
        <div class="dayanddate">
            <div class="days">
                <label class="day">Sun</label>
                <label class="day">Mon</label>
                <label class="day">Tue</label>
                <label class="day">Wed</label>
                <label class="day">Thu</label>
                <label class="day">Fri</label>
                <label class="day">Sat</label>
            </div>
            <div class="dates">
                <label class="date">1</label>
                <label class="date">2</label>
                <label class="date">3</label>
                <label class="date">4</label>
                <label class="date">5</label>
                <label class="date">6</label>
                <label class="date">7</label>
                <label class="date">8</label>
                <label class="date">9</label>
                <label class="date">10</label>
                <label class="date">11</label>
                <label class="date">12</label>
                <label class="date">13</label>
                <label class="date">14</label>
                <label class="date">15</label>
            </div>
        </div>
    </div>

    <script>
        const getmonthbtn = document.getElementById('curmonth'),
              getmonthlist = document.querySelector('.month-list'), 
              getmonths = document.querySelectorAll('.months'),  
              getyearbtn = document.getElementById('curyear'),
              getyearlist = document.querySelector('.year-list'),
              getyears = document.querySelectorAll('.years'),
              getdates = document.querySelector('.dates');

              // Sketch for choosedate function
        // getmonthbtn.addEventListener('click',()=>{
        //     if(getmonthlist.classList.contains('show')){
        //         getmonthlist.classList.remove('show');
        //     }else{
        //         getmonthlist.classList.add('show');
        //         getmonths.forEach((eachmonth)=>{
        //             // console.log(eachmonth);
        //             eachmonth.addEventListener('click',(e)=>{
        //                 console.log(e.target);
        //               getmonthbtn.textContent = e.target.textContent;
        //               getmonthlist.classList.remove('show');
        //             })
        //         })
        //     }
        // })   

        getmonthbtn.addEventListener('click',()=>{choosedate(getmonthlist,getmonths,getmonthbtn)});   
        getyearbtn.addEventListener('click',()=>{choosedate(getyearlist,getyears,getyearbtn)})  

        function choosedate(a,b,c){
            if(a.classList.contains('show')){
                a.classList.remove('show');
            }else{
                a.classList.add('show');
                b.forEach((eachmonth)=>{
                    // console.log(eachmonth);
                    eachmonth.addEventListener('click',(e)=>{
                        // console.log(e.target);
                      c.textContent = e.target.textContent;
                      a.classList.remove('show');
             
                      showdate();

                    })
                })
            }

        }
        
        getcurmmandyy();
        function getcurmmandyy(){
            let uimonth = new Date().getMonth();
            let uiyear = new Date().getFullYear();
            // console.log(uimonth);
            // console.log(uiyear);
            getyearbtn.textContent = uiyear;
            // console.log(getmonths[uimonth]);
            getmonthbtn.textContent = getmonths[uimonth].textContent; 
        }

        showdate();
        function showdate(){
            let month;
            for(let i=0;i<getmonths.length;i++){
                if(getmonths[i].textContent == getmonthbtn.textContent){
                    console.log(i);
                    month = i;
                    break;
                }
            };
            let year = Number(getyearbtn.textContent);
            // console.log(month);
            // console.log(year);

            let selectmmandyy = new Date(year,month+1,0);
            let blankday = new Date(year,month,0).getDay();
            let eachday = selectmmandyy.getDate();
            // console.log(selectmmandyy);
            // console.log(selectmmandyy.getDate());
            // console.log(blankday);

            fillblankday(blankday);
            filleachdate(eachday);
        }  

        function fillblankday(blankday){
            getdates.innerHTML = "";
            if(blankday<6){
                for(let i=0;i<=blankday;i++){
                    let newlabel = document.createElement('label')
                        newlabel.className = 'date blank';   
                        newlabel.textContent = "x"; 

                        // console.log('filling blank dates');
                    getdates.appendChild(newlabel);    
                    }
            }
        }   
        function filleachdate(eachday){
            for(i=0;i<eachday;i++){
                let newlabel = document.createElement('label')
                   newlabel.className = 'date';   
                   newlabel.textContent = i+1; 

                //    console.log('filling each date');
                
                getdates.appendChild(newlabel);    
            }
        }
    </script>
</body>
</html>
