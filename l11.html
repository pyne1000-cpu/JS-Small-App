<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emails Send</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            height: 100vh;
            background-color: #a5a5a5;
            display: grid;
            place-items: center;

        }
        .container{
            min-width: 300px;
            min-height: 200px;
            background-color: #5e5e5e;
            padding: 20px;
        }
        .container h3{
            color: #fff;
        }
        .form-control{
            width: 100%;
            display: block;
            padding: 5px;
            margin: 10px 0;
            outline: none;
        }
        .message{
            width: 100%;
            height: 100px;
            outline: none;
            padding: 5px;
            overflow-y: scroll;
        }
        .btn-box{
            display: flex;
            justify-content: end;
        }
        .btn{
            background-color: rgb(68, 168, 250);
            color: #fff;
            padding: 5px 10px;
            border: none;
            outline: none;
            border-radius: 3px;
        }
        span{
            background-color: rgb(10, 87, 149);
            color: #c0bebe;
            padding: 5px 10px;
            /* border-radius: 3px; */
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>This is Emails Box.You can devide by a comma(,)</h3>
        <form action="" class="form" method="">
            <input type="text" name="emails" id="emails" class="form-control" placeholder="Enter your emails...">
            <textarea name="message" id="message" class="message" placeholder="Enter your message"></textarea>
            <div class="btn-box">
                <button class="btn">Send</button>
            </div>
            <span>Sample One</span>
            <span>Sample Two</span>
            <span>Sample Three</span>
        </form>
    </div>

    <script>
        const getinput = document.getElementById('emails');
        const getmessage = document.getElementById('message');
        const getbtn = document.querySelector('.btn');

        getinput.addEventListener('keyup',function(e){
            // console.log(this.value);
            abc(this.value);

        })

        function abc(inputtext){
            const eitems = inputtext.split(',');
            console.log(eitems);
        }
    </script>
</body>
</html>
