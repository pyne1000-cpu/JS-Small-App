<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Effect</title>

    <style>
        body{
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 1),rgba(0, 0, 0, .5));
            color: #fff;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 0;
        }
        span#text{
            animation: mycursor 1s infinite;
        }
        @keyframes mycursor{
            from{
                border: none;
            }
            to{
                border-right: 2px solid #bbb;
            }
        }
        .red{
            color: red;
        }
        .skyblue{
            color: skyblue;
        }
        .violet{
            color: violet;
        }
        .yellow{
            color: yellow;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>We build with <span id="text"></span> Framework.</h1>
        <h3>Start integrate with your bussiness and app</h3>
        <p>Contrary to popular belief, Lorem Ipsum is not simply random text. It has roots in a piece of classical Latin literature from 45 BC, making it over 2000 years old.</p>
    </div>

    <script>
        const getspan = document.getElementById('text');

        const languages = ['NodeJS', 'ReactJS', 'VueJS', 'Laravel'];
        const colors = ['red', 'skyblue', 'violet', 'yellow'];

        function* genfun(){
            let idx = 0;
            while(true){
                yield idx;
                idx++;               
                if(idx >= 4){
                idx = 0
                }
            }
            
        }
        const keygen = genfun();

        // console.log(keygen.next());
        // console.log(keygen.next());
        // console.log(keygen.next());
        // console.log(keygen.next());
        // console.log(keygen.next());
        // console.log(keygen.next());

        // console.log(languages[keygen.next().value]);
        // console.log(languages[keygen.next().value]);
        // console.log(languages[keygen.next().value]);
        // console.log(languages[keygen.next().value]);
        // console.log(languages[keygen.next().value]);
        // console.log(languages[keygen.next().value]);
        // console.log(languages[keygen.next().value]);
        // console.log(languages[keygen.next().value]);
        // console.log(languages[keygen.next().value]);
        // console.log(languages[keygen.next().value]);

        showtxt(languages[keygen.next().value]);

        function showtxt(word){
            // console.log(word); 
            getspan.textContent = ""
            getspan.classList.add(colors[languages.indexOf(word)])
            let x = 0;

            let repeatfun = setInterval(function(){
                if(x>=word.length){
                    clearInterval(repeatfun);
                    deletetxt()
                }else{
                    getspan.textContent += word[x];
                    x++;
                }
            },300)
        }

        function deletetxt(){
            let getword = getspan.textContent;
            // console.log(getword);

            let idx = getword.length-1;
            // console.log(idx);

            const repeatdel = setInterval(function(){
                if(idx<0){
                    clearInterval(repeatdel);
                    
                    // getspan.className = '';
                    // getspan.removeAttribute('class');
                    getspan.classList.remove(colors[languages.indexOf(getword)]);

                    showtxt(languages[keygen.next().value]);
                }else{
                    getspan.textContent = getword.substring(0,idx);
                    idx--;
                }
            },300)
        }
