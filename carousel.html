<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>

    <!-- bootstrap css1  -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
   
    <!-- fontawesome css1  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <!-- custom css  -->
    <style>
        body{
            background-color: #e9e7e7 ;
            color: red;
            height: 100vh;

            display: grid;
            place-items: center;
        }

        .container{
            width: 700px;
            background-color: #444;
            box-shadow: 0 2px 10px rgb(104, 221, 247);
        }

        .carousel-indicators .indicator_cs{
            background-color: rgb(142, 147, 142);
            opacity: 1;
        }
        .carousel-indicators .indicator_cs.active{
            background-color: rgb(254, 34, 137);    
        }

       /* //GPT CODE//  */
        /* .carousel-indicators [data-bs-target]{
    background-color: red;
}
.carousel-indicators .active{
    background-color: blue;
} */

      /* //GPT CODE//  */
        /* .carousel-indicators [data-bs-target]{
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: #999;
    opacity: 1;
}
.carousel-indicators .active{
    background-color: #ff5722;

        .img_cs{
            margin: auto;
            width: 500px;
        }

        .job-title_cs{
            font-size: 3rem;
            color: yellow;
            -webkit-text-stroke: 1px #444;
        }
    </style> 

</head> 
<body>
    <div class="container">
        <div id="myCarousel" class="carousel slide">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="indicator_cs active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1" class="indicator_cs" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2" class="indicator_cs" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="./user/user1.jpg" class="d-block img_cs" alt="user1">
                    <div class="carousel-caption d-none d-md-block">
                        <h5 class="job-title_cs">Producer</h5>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="./user/user2.jpg" class="d-block img_cs" alt="user2">
                    <div class="carousel-caption d-none d-md-block">
                        <h5 class="job-title_cs">Senior Developer</h5>
                    </div> 
                </div>
                <div class="carousel-item">
                    <img src="./user/user3.jpg" class="d-block img_cs" alt="user3">
                    <div class="carousel-caption d-none d-md-block">
                        <h3 class="job-title_cs">Sale</h3>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
    
    <!-- bootstrap js1  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
