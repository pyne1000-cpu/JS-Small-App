<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visa Card</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            height: 100vh;
            background-color: #000;
            display: grid;
            place-items: center;
        }
        .container{
            background: linear-gradient(360deg,#000,#333);
            border-radius: 20px;
        }
        .visa-card{
            width: 500px;
            background: rgba(255, 255, 255, .1);
            border-radius: 20px;
            box-shadow: 0 2px 10px yellow;
            padding: 10px;
            position: relative;
        }
        .visa-card .inputs{
            color: #f4f4f4;
            /* border: 1px solid #f4f4f4; */
            /* margin: 0 40px; */
            padding: 5px;
            position: relative;
            overflow: hidden;

        }
        .visa-card .inputs[id="card-code"]{
            font-size: 18px;
            /* width: 100%; */

            margin-bottom: 10px;
        }
        .visa-card input{
            display: block; 
            /* background: none; */
            /* color: #f4f4f4; */
            border: none;
            outline: none;
            padding: 10px 10px 1px 10px;
        }
        .visa-card input[id="one"]{
            font-size: 25px;
            letter-spacing: 3px;
        }
        .visa-card input[id="two"]{
            width: 30ch;
            background-color: red;
        }
        .visa-card input[id="three"]{
            width: 15ch;
        }
        .visa-card input[id="four"]{
            width: 8ch;
        }
        .visa-card span{
            width: 100%;
            height: 2px;
            background-color:  #f4f4f4;
            
            position: absolute;
            left: -100%;

            transition: left .5s ease-out;
        }
        .visa-card span[id="a"]{
            width: 36ch;
        }
        .visa-card span[id="b"]{
            width: 28ch;
        }
        .visa-card span[id="c"]{
            width: 15ch;
        }
        .visa-card span[id="d"]{
            width: 36ch;
        }
        
        .visa-card .div-gp{
            display: flex;
            justify-content: space-evenly;

            /* margin-bottom: 20px; */
        }
        .visa-card .div-gp label{
            font-size: 18px;
        }
        .visa-card .div-gp input{
            /* padding: 5px; */
            font-size: 18px;
        }
        .visa-card input:hover + span,.visa-card input:focus ~ span{
            left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="visa-card">
            <div class="logo">
                <img src="https://images.seeklogo.com/logo-png/61/3/visa-logo-png_seeklogo-616773.png" alt="" style="width: 100px; margin-left: 20px;">
            </div>
            <form action="" method="" class="form-group">
                <div id="card-code" class="card-code inputs">
                    <label for="one" style="font-size: 25px;">Card Number</label>
                    <input type="text" id="one" placeholder="1234 1234 1234 1234" size="25" maxlength="18">
                    <span id="a"></span>
                </div>
                <div class="div-gp">
                    <div id="card-holder" class="card-holder inputs">
                        <label for="two">Card Holder Name</label>
                        <input type="text" id="two" placeholder="Name" maxlength="25">
                        <span id="b"></span>
                    </div>
                    <div id="exp" class="exp inputs">
                        <label for="three">Exp Date</label>
                        <input type="text" id="three" placeholder="dd/mm/yy" maxlength="10">
                        <span id="c"></span>
                    </div>
                    <div id="ccv" class="ccv inputs">
                        <label for="four">CCV</label>
                        <input type="text" id="four" placeholder="123" maxlength="3">
                        <span id="d"></span>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <script>

    </script>
</body>
</html>
